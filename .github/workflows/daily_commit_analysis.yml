name: Daily vLLM Commit Analysis

on:
  schedule:
    - cron: '0 2 * * *'       # UTC 02:00 (Beijing 10:00)
  workflow_dispatch:
    inputs:
      start_date:
        description: '开始日期 (YYYY-MM-DD)，留空则使用状态文件'
        required: false
        type: string
      end_date:
        description: '结束日期 (YYYY-MM-DD)，留空则为昨天'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: commit-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run commit analysis
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DINGTALK_MCP_URL: ${{ secrets.DINGTALK_MCP_URL }}
        run: |
          python tools/commit_analyzer.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}"

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commit-analysis-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Commit state file update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commit_analysis_state.json
          git diff --staged --quiet || git commit -m "chore: update commit analysis state [skip ci]"
          git push
